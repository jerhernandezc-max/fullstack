<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Ferretería Los Maestros</title>
  <link rel="stylesheet" href="style.css">
  <script src="productos.js" defer></script>
  <script src="funciones.js" defer></script>
</head>
<body>
  <header>
    <h1>Ferretería Los Maestros</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main>
    <section id="catalogo">
      <h2>Catálogo de productos</h2>
      <p class="intro">Precios en pesos chilenos (CLP). Consulta el stock antes de venir a retirar.</p>

      <div class="controles-catalogo">
        <input type="search" id="buscador" placeholder="Buscar producto...">
        <select id="filtro-categoria"></select>
      </div>

      <p id="resultado-conteo"></p>

      <div class="grilla-productos" id="grilla-productos"></div>
      <p class="sin-resultados" id="sin-resultados" hidden>No se encontraron productos.</p>
    </section>
  </main>

  <footer>
    <p>Ferretería Los Maestros - La Serena, Región de Coquimbo</p>
    <p>© 2026 Ferretería Los Maestros</p>
  </footer>
</body>
</html>
